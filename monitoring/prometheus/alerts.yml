groups:
  - name: autonomous-noc
    rules:
      - alert: BackendDown
        expr: up{job="autonomous-noc-backend"} == 0
        for: 30s
        labels: {severity: critical, service: backend}
        annotations:
          summary: Autonomous NOC backend erişilemiyor
          description: Prometheus backend hedefini 30 saniyedir scrape edemiyor.
      - alert: HighApiLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(autonomous_noc_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 2m
        labels: {severity: high, service: backend}
        annotations:
          summary: API p95 gecikmesi yüksek

